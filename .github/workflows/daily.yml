# Daily automatic analysis of the 4 daily tips (see daily_run.py).
# Every hour from 10:00 to 18:00 Uganda time (07:00-15:00 UTC): the day's tips are posted some time in that
# window (or not at all). Each run analyses only tips it hasn't seen yet and stops looking once all 4 are in.
# Runs that find nothing new cost nothing (no AI).
name: Daily tips analysis

on:
  schedule:
    - cron: "0 7-15 * * *"
  workflow_dispatch:      # "Run workflow" button on GitHub, for a manual run
    inputs:
      check_results:
        description: "Only test the results key for this date (YYYY-MM-DD), change nothing"
        required: false
        default: ""
      check_match:
        description: "Only show the match data for 'YYYY-MM-DD|Home vs Away', change nothing"
        required: false
        default: ""

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "$CHECK_MATCH" ]; then python match_data.py "${CHECK_MATCH%%|*}" "${CHECK_MATCH#*|}";
          elif [ -n "$CHECK_DATE" ]; then python results_api.py --check "$CHECK_DATE";
          else python daily_run.py; fi
        env:
          CHECK_DATE: ${{ github.event.inputs.check_results }}
          CHECK_MATCH: ${{ github.event.inputs.check_match }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
