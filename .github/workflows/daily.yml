# Daily automatic analysis of the 4 daily tips (see daily_run.py).
# Every hour from 13:00 to 23:00 Uganda time (10:00-20:00 UTC): tips are often posted in the evening for
# late kickoffs, so each run analyses only tips it hasn't seen yet, and stops looking once all 4 are in.
# Runs that find nothing new cost nothing (no AI).
name: Daily tips analysis

on:
  schedule:
    - cron: "0 10-20 * * *"
  workflow_dispatch:      # "Run workflow" button on GitHub, for a manual run
    inputs:
      check_results:
        description: "Only test the results key for this date (YYYY-MM-DD), change nothing"
        required: false
        default: ""

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "$CHECK_DATE" ]; then python results_api.py --check "$CHECK_DATE"; else python daily_run.py; fi
        env:
          CHECK_DATE: ${{ github.event.inputs.check_results }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
